spring.application.name=invoice
server.port=8080

# Local secrets (git-ignored). Copy secrets.properties.example to secrets.properties and fill it in.
spring.config.import=optional:file:./secrets.properties

# Database Configuration (Defaults to embedded persistent H2; overrides to MySQL if DB_URL is specified)
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/invoicedb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}

# H2 Console: disabled by default. Set H2_CONSOLE_ENABLED=true locally to open http://localhost:8080/h2-console
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Security & JWT
# No default secret is committed. If JWT_SECRET is missing, a random key is generated at startup
# (fine for local demos; logins reset on restart). Always set JWT_SECRET when deploying.
jwt.secret=${JWT_SECRET:}
jwt.expiration=86400000

# AI Configuration: Gemini (Primary) & ChatGPT / OpenAI (Fallback)
ai.gemini.api-key=${GEMINI_API_KEY:}
ai.gemini.model=${GEMINI_MODEL:gemini-2.5-flash}
ai.gemini.url=https://generativelanguage.googleapis.com/v1beta/models

ai.openai.api-key=${OPENAI_API_KEY:}
ai.openai.model=${OPENAI_MODEL:gpt-4o-mini}
ai.openai.url=https://api.openai.com/v1/chat/completions

# CORS: comma-separated list of allowed frontend origins
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:8080,http://127.0.0.1:8080}
